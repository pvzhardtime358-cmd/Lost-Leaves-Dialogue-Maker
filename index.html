<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Added viewport meta tag to fix the tiny, scaled-out mobile view -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lost Leaves Dialogue Maker</title>
<style>
    :root {
        --dark-blue: #001f3f;
        --mid-blue: #0072ff;
        --light-blue: #00d4ff;
        --bg-color: #0b0e14;
        --panel-color: #161b22;
        --input-bg: #0d1117;
    }

    * {
        box-sizing: border-box;
    }

    body {
        background: var(--bg-color);
        color: #e6edf3;
        font-family: 'Segoe UI', Roboto, sans-serif;
        display: flex;
        justify-content: center;
        padding: 15px 10px;
        margin: 0;
    }

    .container {
        width: 100%;
        max-width: 700px;
        background: var(--panel-color);
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.8);
        border: 1px solid rgba(0, 212, 255, 0.15);
    }

    h1 { 
        background: linear-gradient(to right, var(--light-blue), var(--mid-blue));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-align: center; 
        margin: 0 0 20px 0;
        font-size: 1.6em;
    }

    label { 
        display: block; 
        margin-top: 12px; 
        font-weight: 600; 
        color: var(--light-blue); 
        font-size: 0.8em;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    
    .id-section {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--input-bg);
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #30363d;
        margin-bottom: 15px;
    }

    .prefix-label { color: var(--light-blue); font-family: monospace; font-size: 0.95em; }

    select, input, textarea {
        width: 100%;
        margin: 5px 0;
        padding: 12px;
        background: var(--input-bg);
        color: #fff;
        border: 1px solid #30363d;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        appearance: none;
        -webkit-appearance: none;
    }
    
    select {
        background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2300d4ff%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
        background-repeat: no-repeat;
        background-position: right 12px top 50%;
        background-size: 10px auto;
    }

    select:focus, input:focus, textarea:focus {
        border-color: var(--mid-blue);
    }

    #customName { border: none; background: transparent; flex-grow: 1; margin: 0; padding: 0; }
    
    #customNpcInput { border: none; background: transparent; flex-grow: 1; margin: 0; padding: 0; color: #fff;}

    .grid-options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .checkbox-group {
        display: flex;
        overflow-x: auto;
        white-space: nowrap;
        gap: 15px;
        background: var(--input-bg);
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #30363d;
        margin-bottom: 15px;
        scrollbar-width: thin;
        scrollbar-color: var(--mid-blue) var(--input-bg);
    }

    .checkbox-item {
        display: flex;
        align-items: center;
        font-size: 0.85em;
        cursor: pointer;
        flex: 0 0 auto; 
    }

    .checkbox-item input { margin-right: 8px; accent-color: var(--light-blue); width: 16px; height: 16px; }

    button {
        padding: 12px;
        font-size: 0.95em;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        text-transform: uppercase;
        transition: opacity 0.2s;
    }
    
    button:active {
        opacity: 0.7;
    }

    .btn-add-npc {
        background: var(--mid-blue);
        color: white;
        padding: 8px 16px;
        font-size: 0.8em;
    }

    .btn-generate { 
        width: 100%;
        background: linear-gradient(135deg, var(--mid-blue), var(--dark-blue));
        color: white; 
        margin-bottom: 12px;
        margin-top: 5px;
    }
    
    .btn-clear { background: #21262d; color: #f85149; width: 48%; border: 1px solid rgba(248,81,73,0.1); }
    .btn-copy { background: #21262d; color: var(--light-blue); width: 48%; border: 1px solid rgba(0,212,255,0.1); }

    pre {
        background: #010409;
        padding: 15px;
        white-space: pre-wrap;
        border: 1px solid var(--mid-blue);
        border-radius: 8px;
        color: var(--light-blue);
        font-family: 'Consolas', monospace;
        height: 160px; 
        overflow-y: auto;
        margin-top: 10px;
        font-size: 0.85em;
        line-height: 1.4;
    }

    h3 {
        color: var(--light-blue);
        font-size: 0.85em;
        margin: 20px 0 10px 0;
        border-left: 3px solid var(--mid-blue);
        padding-left: 10px;
    }
    
    .scg-warning {
        font-size: 0.75em;
        color: #f85149;
        font-style: italic;
        margin-top: -10px;
        margin-bottom: 15px;
        line-height: 1.3;
    }

    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--mid-blue); border-radius: 10px; }
</style>
</head>
<body>

<div class="container">
    <h1>Lost Leaves Dialogue Maker</h1>

    <label>Narrative Name</label>
    <div class="id-section">
        <span class="prefix-label">NARRATIVE_</span>
        <input type="text" id="customName" placeholder="NAME" value="TUTORIAL">
    </div>

    <div class="grid-options">
        <div>
            <label>Action</label>
            <select id="npcAction">
                <option value="">None</option>
                <option value="NPC_ENTER">NPC_ENTER</option>
                <option value="NPC_EXIT">NPC_EXIT</option>
            </select>
        </div>
        <div>
            <label>Target</label>
            <select id="npcTarget">
                <option value="crazydave">Dave</option>
                <option value="winnie">Penny</option>
                <option value="zombossicon">Zomboss</option>
                <option value="evilcrazydave">Evil Dave</option>
            </select>
        </div>
    </div>

    <label>Speaker</label>
    <select id="speaker">
        <option value="crazydave">Dave</option>
        <option value="winnie">Penny</option>
        <option value="zombossicon">Zomboss</option>
        <option value="evilcrazydave">Evil Dave</option>
        <option value="none">None</option>
    </select>

    <label>Add Custom NPC</label>
    <div class="id-section">
        <input type="text" id="customNpcInput" placeholder="Enter internal ID">
        <button class="btn-add-npc" onclick="addCustomNpc()">ADD</button>
    </div>
    <div class="scg-warning">
        *Note: Custom NPCs and Evil Dave will only render in-game if you have their specific SCG and code installed.
    </div>

    <label>Emotions & Flags (Scroll →)</label>
    <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" class="flag" value="EXCITED"> EXCITED</label>
        <label class="checkbox-item"><input type="checkbox" class="flag" value="PLAYFUL"> PLAYFUL</label>
        <label class="checkbox-item"><input type="checkbox" class="flag" value="TIRED"> TIRED</label>
        <label class="checkbox-item"><input type="checkbox" class="flag" value="SAD"> SAD</label>
        <label class="checkbox-item"><input type="checkbox" class="flag" value="LONG"> LONG</label>
        <label class="checkbox-item"><input type="checkbox" class="flag" value="START_DIALOG_MUSIC"> START MUSIC</label>
        <label class="checkbox-item"><input type="checkbox" class="flag" value="BRINGOUT_TACO"> SHOW TACO</label>
        <label class="checkbox-item"><input type="checkbox" class="flag" value="EAT_TACO"> EAT TACO</label>
        <label class="checkbox-item"><input type="checkbox" class="flag" value="SPECIAL1"> SPECIAL 1</label>
        <label class="checkbox-item"><input type="checkbox" class="flag" value="SPECIAL2"> SPECIAL 2</label>
    </div>

    <label>Dialogue</label>
    <textarea id="dialogue" rows="3" placeholder="Text here..."></textarea>

    <button class="btn-generate" onclick="generate()">Add Line</button>
    
    <div style="display: flex; justify-content: space-between;">
        <button class="btn-copy" onclick="copyOutput()">Copy All</button>
        <button class="btn-clear" onclick="clearAll()">Clear All</button>
    </div>

    <h3>Final Level Code:</h3>
    <pre id="output"></pre>
    
    <!-- Fixed Website Counter -->
    <div style="text-align: center; margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 10px;">
        <span style="color: var(--light-blue); font-size: 0.85em; font-weight: bold;">TOTAL VISITS:</span>
        <img src="https://api.visitorbadge.io/api/visitors?path=lost-leaves-dialogue-maker&countColor=%230072ff&bgColor=%23161b22" alt="Visitor Count">
    </div>
</div>

<script>
let fullOutput = "";
let currentNumber = 1;

function addCustomNpc() {
    let customInput = document.getElementById("customNpcInput");
    let npcId = customInput.value.trim();
    
    if (npcId === "") return;

    let targetDropdown = document.getElementById("npcTarget");
    let speakerDropdown = document.getElementById("speaker");

    let targetOption = new Option(npcId + " (Custom)", npcId);
    let speakerOption = new Option(npcId + " (Custom)", npcId);

    targetDropdown.add(targetOption);
    speakerDropdown.insertBefore(speakerOption, speakerDropdown.options[speakerDropdown.options.length - 1]);

    targetDropdown.value = npcId;
    speakerDropdown.value = npcId;

    customInput.value = "";
}

function generate() {
    let name = document.getElementById("customName").value.trim().toUpperCase().replace(/\s+/g, '_') || "CUSTOM";
    let action = document.getElementById("npcAction").value;
    let target = document.getElementById("npcTarget").value;
    let speaker = document.getElementById("speaker").value;
    let text = document.getElementById("dialogue").value;
    
    let phase = (action === "NPC_EXIT") ? "OUTRO" : "INTRO";
    let id = `NARRATIVE_${name}_${phase}_${currentNumber}`;
    
    let selectedFlags = Array.from(document.querySelectorAll('.flag:checked'));
    
    // Kept your custom texts, but re-added the flag fix from earlier to ensure {EXCITED:winnie} formats properly!
    let flagNpc = speaker !== "none" ? speaker : target;
    let flags = selectedFlags.map(c => `{${c.value}:${flagNpc}}`).join("");
    
    let tags = "";
    if (action) tags += `{${action}:${target}}`;
    tags += flags;
    if (speaker !== "none") {
        if (speaker === "crazydave") tags += "{SAY}"; 
        else tags += `{SAY:${speaker}}`;
    }

    fullOutput += `"${id}",\n"${tags}${text}",\n`;
    document.getElementById("output").textContent = fullOutput;
    currentNumber++;
    document.getElementById("dialogue").value = "";
    
    const out = document.getElementById("output");
    out.scrollTop = out.scrollHeight;
}

function copyOutput() {
    const el = document.createElement('textarea');
    el.value = fullOutput; document.body.appendChild(el);
    el.select(); document.execCommand('copy');
    document.body.removeChild(el);
    alert("Copied!");
}

function clearAll() {
    if(confirm("Clear list?")) {
        fullOutput = ""; currentNumber = 1;
        document.getElementById("output").textContent = "";
    }
}
</script>

</body>
</html>
